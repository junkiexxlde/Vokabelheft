<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabelheft - Vocabulary Notebook</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --secondary-color: #10B981;
            --background-color: #ffffff;
            --text-color: #1F2937;
            --table-header-bg: #F3F4F6;
            --border-color: #E5E7EB;
        }

        .dark-mode {
            --background-color: #1F2937;
            --text-color: #F9FAFB;
            --table-header-bg: #374151;
            --border-color: #4B5563;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .input-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .language-column {
            flex: 1;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }

        .language-column h2 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--background-color);
            color: var(--text-color);
            resize: vertical;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #3730A3;
        }

        #darkModeToggle {
            background-color: var(--secondary-color);
        }

        #darkModeToggle:hover {
            background-color: #059669;
        }

        .actions {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .vocab-list {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: var(--table-header-bg);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: bold;
        }

        tr:hover {
            background-color: rgba(79, 70, 229, 0.1);
        }

        @media (max-width: 768px) {
            .input-section {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Vokabelheft</h1>
            <button id="darkModeToggle">🌓 Dark Mode</button>
        </header>

        <div class="input-section">
            <div class="language-column">
                <h2>German</h2>
                <textarea id="germanInput" placeholder="Enter German word/phrase..." rows="2"></textarea>
                <div class="button-group">
                    <button id="audioInputDe">🎤 Speak</button>
                    <button id="translateDeEnDeepL">Translate with DeepL</button>
                    <button id="translateDeEnGoogle">Translate with Google</button>
                    <button id="translateDeEnBing">Translate with Bing</button>
                    <button id="translateDeEnMistral">Translate with Mistral</button>
                </div>
            </div>

            <div class="language-column">
                <h2>English</h2>
                <textarea id="englishInput" placeholder="Enter English word/phrase..." rows="2"></textarea>
                <div class="button-group">
                    <button id="audioInputEn">🎤 Speak</button>
                    <button id="translateEnDeDeepL">Translate with DeepL</button>
                    <button id="translateEnDeGoogle">Translate with Google</button>
                    <button id="translateEnDeBing">Translate with Bing</button>
                    <button id="translateEnDeMistral">Translate with Mistral</button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="addVocab">Add Vocabulary</button>
            <button id="clearAll">Clear All</button>
            <button id="exportVocab">Export as JSON</button>
            <input type="file" id="importVocab" accept=".json" style="display: none;">
            <button onclick="document.getElementById('importVocab').click()">Import JSON</button>
        </div>

        <div class="vocab-list">
            <h2>Vocabulary List</h2>
            <table id="vocabTable">
                <thead>
                    <tr>
                        <th>German</th>
                        <th>English</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="vocabTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;

        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️ Light Mode';
        }

        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDarkMode = body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDarkMode ? 'enabled' : 'disabled');
            darkModeToggle.textContent = isDarkMode ? '☀️ Light Mode' : '🌓 Dark Mode';
        });

        // Audio Input (Web Speech API)
        const audioInputDe = document.getElementById('audioInputDe');
        const audioInputEn = document.getElementById('audioInputEn');
        const germanInput = document.getElementById('germanInput');
        const englishInput = document.getElementById('englishInput');

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = false;
        recognition.interimResults = false;

        function startAudioInput(targetElement, lang) {
            recognition.lang = lang;
            recognition.start();
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                targetElement.value = transcript;
            };
        }

        audioInputDe.addEventListener('click', () => startAudioInput(germanInput, 'de-DE'));
        audioInputEn.addEventListener('click', () => startAudioInput(englishInput, 'en-US'));

        // Translation Functions
        function translateWithDeepL(text, sourceLang, targetLang) {
            const deeplUrl = `https://www.deepl.com/translator#${sourceLang}/${targetLang}/${encodeURIComponent(text)}`;
            window.open(deeplUrl, '_blank');
        }

        function translateWithGoogle(text, sourceLang, targetLang) {
            const googleUrl = `https://translate.google.com/?sl=${sourceLang}&tl=${targetLang}&text=${encodeURIComponent(text)}&op=translate`;
            window.open(googleUrl, '_blank');
        }

        function translateWithBing(text, sourceLang, targetLang) {
            const bingUrl = `https://www.bing.com/translator/?from=${sourceLang}&to=${targetLang}&text=${encodeURIComponent(text)}`;
            window.open(bingUrl, '_blank');
        }

        function translateWithMistral(text, sourceLang, targetLang) {
            // Placeholder for Mistral AI translation (redirect to a free interface if available)
            alert("Mistral AI translation: Redirect to a free interface or use API if available.");
        }

        // Attach translation buttons
        document.getElementById('translateDeEnDeepL').addEventListener('click', () => {
            translateWithDeepL(germanInput.value, 'de', 'en');
        });

        document.getElementById('translateDeEnGoogle').addEventListener('click', () => {
            translateWithGoogle(germanInput.value, 'de', 'en');
        });

        document.getElementById('translateDeEnBing').addEventListener('click', () => {
            translateWithBing(germanInput.value, 'de', 'en');
        });

        document.getElementById('translateDeEnMistral').addEventListener('click', () => {
            translateWithMistral(germanInput.value, 'de', 'en');
        });

        document.getElementById('translateEnDeDeepL').addEventListener('click', () => {
            translateWithDeepL(englishInput.value, 'en', 'de');
        });

        document.getElementById('translateEnDeGoogle').addEventListener('click', () => {
            translateWithGoogle(englishInput.value, 'en', 'de');
        });

        document.getElementById('translateEnDeBing').addEventListener('click', () => {
            translateWithBing(englishInput.value, 'en', 'de');
        });

        document.getElementById('translateEnDeMistral').addEventListener('click', () => {
            translateWithMistral(englishInput.value, 'en', 'de');
        });

        // Vocabulary Management
        let vocabulary = JSON.parse(localStorage.getItem('vocabulary')) || [];

        function renderVocabulary() {
            const tableBody = document.getElementById('vocabTableBody');
            tableBody.innerHTML = '';
            vocabulary.forEach((entry, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${entry.german}</td>
                    <td>${entry.english}</td>
                    <td>
                        <button onclick="editVocabulary(${index})">Edit</button>
                        <button onclick="deleteVocabulary(${index})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function addVocabulary() {
            const german = germanInput.value.trim();
            const english = englishInput.value.trim();
            if (german && english) {
                vocabulary.push({ german, english });
                localStorage.setItem('vocabulary', JSON.stringify(vocabulary));
                renderVocabulary();
                germanInput.value = '';
                englishInput.value = '';
            }
        }

        function deleteVocabulary(index) {
            vocabulary.splice(index, 1);
            localStorage.setItem('vocabulary', JSON.stringify(vocabulary));
            renderVocabulary();
        }

        function editVocabulary(index) {
            const entry = vocabulary[index];
            germanInput.value = entry.german;
            englishInput.value = entry.english;
            vocabulary.splice(index, 1);
            localStorage.setItem('vocabulary', JSON.stringify(vocabulary));
            renderVocabulary();
        }

        function clearAllVocabulary() {
            if (confirm('Are you sure you want to clear all vocabulary?')) {
                vocabulary = [];
                localStorage.setItem('vocabulary', JSON.stringify(vocabulary));
                renderVocabulary();
            }
        }

        function exportVocabulary() {
            const data = JSON.stringify(vocabulary, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vocabulary.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importVocabulary(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        vocabulary = JSON.parse(e.target.result);
                        localStorage.setItem('vocabulary', JSON.stringify(vocabulary));
                        renderVocabulary();
                    } catch (error) {
                        alert('Error importing file. Please check the format.');
                    }
                };
                reader.readAsText(file);
            }
        }

        // Attach event listeners
        document.getElementById('addVocab').addEventListener('click', addVocabulary);
        document.getElementById('clearAll').addEventListener('click', clearAllVocabulary);
        document.getElementById('exportVocab').addEventListener('click', exportVocabulary);
        document.getElementById('importVocab').addEventListener('change', importVocabulary);

        // Initialize
        renderVocabulary();
    </script>
</body>
</html>
